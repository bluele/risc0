name: CI

on:
  merge_group:
  pull_request:
    branches: [main, "release-*"]
  push:
    branches: ["bluele/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CC: clang
  CXX: clang++

defaults:
  run:
    # This ensures `-eo pipefail`, which is important for catching errors
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      risc0: ${{ steps.filter.outputs.risc0 }}
    steps:
      - uses: actions/checkout@v4
      - uses: risc0/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            base: &base
              - .github/actions/**
              - .github/workflows/main.yml
              - Cargo.toml
              - rust-toolchain.toml
              - Cargo.lock
              - rzup/**
            risc0:
              - *base
              - risc0/**

  # see: https://github.com/orgs/community/discussions/26822
  main-status-check:
    if: always()
    needs:
      - changes
      - check
      - clippy
      - test
      - guest-abi
    runs-on: ubuntu-latest
    steps:
      - name: Check all job status
        # see https://docs.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions#needs-context
        # see https://stackoverflow.com/a/67532120/4907315
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rustup
      - name: Install cargo-sort
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-sort
          version: "1.0"
      - name: Install cargo-rdme
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-rdme
          version: "1.4.3"
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path examples/Cargo.toml
      - run: cargo sort --workspace --grouped --check
      - run: cargo sort --workspace --grouped --check examples
      - name: cargo rdme in bonsai/sdk
        run: cargo rdme -c
        working-directory: bonsai/sdk
      - name: cargo rdme in risc0/zkvm
        run: cargo rdme -c
        working-directory: risc0/zkvm
      - name: cargo rdme in risc0/groth16
        run: cargo rdme -c
        working-directory: risc0/groth16
      - name: Compare circom hashes to golden values
        run: bash ./.github/scripts/circom_stable.sh


  clippy:
    if: needs.changes.outputs.risc0 == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    env:
      RISC0_SKIP_BUILD: 1
      RISC0_SKIP_BUILD_KERNELS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/rustup
      - name: "root: cargo clippy"
        run: cargo clippy -F unstable --all-targets
      # Not the examples: cargo cannot fetch the git dependency of `examples/smartcore-ml`, a
      # repository that GitHub answers 404 for.

  test:
    if: needs.changes.outputs.risc0 == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/rustup
      # The executor alone, with the features of executor-only builds.
      - name: "rv32im: cargo test, execute"
        run: cargo test -p risc0-circuit-rv32im --features execute --lib
      # The executor against the circuit: the CPU prover proves each test program.
      - name: "rv32im: cargo test, prove"
        run: cargo test -p risc0-circuit-rv32im --features prove --lib

  guest-abi:
    if: needs.changes.outputs.risc0 == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/rustup
      # The test Guests need RISC Zero's Rust and C++ toolchains.
      - name: Install the RISC Zero toolchains
        run: |
          cargo install rzup --version 0.5.2 --locked --no-default-features --features cli,install
          rzup install rust 1.97.0
          rzup install cpp 2024.1.5
      # The Guest ABI against the executor: multi_test's poseidon2 cases call sys_poseidon2 and
      # check each digest in the Guest. The features are those of executor-only builds.
      - name: "risc0-zkvm: multi_test poseidon2, execute"
        run: cargo test -p risc0-zkvm --no-default-features --features execute --lib -- poseidon2

